name: iOS TestFlight Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Setup App Store Connect API Key
      env:
        ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY }}
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      run: |
        mkdir -p ~/private_keys
        echo "$ASC_KEY_CONTENT" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
        echo "ASC_KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV

    - name: Install Distribution Certificate
      env:
        DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
      run: |
        # Create keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        echo "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

        security import $CERTIFICATE_PATH -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Provisioning Profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - name: Build and Archive
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        cd ios/App

        xcodebuild -project App.xcodeproj \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/App.xcarchive \
          archive \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
          -authenticationKeyID ${ASC_KEY_ID} \
          -authenticationKeyIssuerID ${ASC_ISSUER_ID}

    - name: Export IPA
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        cd ios/App

        xcodebuild -exportArchive \
          -archivePath $PWD/build/App.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist $PWD/exportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
          -authenticationKeyID ${ASC_KEY_ID} \
          -authenticationKeyIssuerID ${ASC_ISSUER_ID}

    - name: Upload to TestFlight
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        cd ios/App
        xcrun altool --upload-app \
          -f $PWD/build/App.ipa \
          -t ios \
          --apiKey ${ASC_KEY_ID} \
          --apiIssuer ${ASC_ISSUER_ID}
