name: iOS TestFlight Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Fastlane
      run: |
        cd fastlane
        bundle install

    - name: Setup App Store Connect API Key
      env:
        ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY }}
      run: |
        mkdir -p ~/private_keys
        echo "$ASC_KEY_CONTENT" > ~/private_keys/AuthKey.p8
        chmod 600 ~/private_keys/AuthKey.p8

    - name: Build and Upload with Fastlane
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_KEY_PATH: ~/private_keys/AuthKey.p8
        ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY }}
        TEAM_ID: 9V74TT48MV
      run: |
        cd fastlane
        bundle exec fastlane beta_auto
