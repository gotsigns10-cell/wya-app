name: iOS TestFlight Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      CERTIFICATE_PASSWORD: "wya2026"
      PROVISIONING_PROFILE_UUID: "866843c3-81a5-4817-b415-d5fb313c6106"
      TEAM_ID: "9V74TT48MV"
      BUNDLE_ID: "com.universoul.wya"

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Fastlane
      run: |
        cd fastlane
        bundle install

    - name: Setup App Store Connect API Key
      env:
        ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY }}
      run: |
        mkdir -p ~/private_keys
        echo "$ASC_KEY_CONTENT" > ~/private_keys/AuthKey.p8
        chmod 600 ~/private_keys/AuthKey.p8

    - name: Install code signing
      run: |
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH

        # Decode and import certificate (macOS uses -D for decode)
        echo "Installing distribution certificate..."
        base64 -D -i ios/signing/dist-cert.p12.b64 -o $RUNNER_TEMP/dist-cert.p12
        security import $RUNNER_TEMP/dist-cert.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Install provisioning profile (macOS uses -D for decode)
        echo "Installing provisioning profile..."
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        base64 -D -i ios/signing/WYA_App_Store.mobileprovision.b64 -o ~/Library/MobileDevice/Provisioning\ Profiles/$PROVISIONING_PROFILE_UUID.mobileprovision

        # Verify
        echo "Signing identities:"
        security find-identity -v -p codesigning
        echo ""
        echo "Installed profiles:"
        ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Resolve Swift Package Dependencies
      run: |
        cd ios/App
        xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

    - name: Build and Upload with Fastlane
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_KEY_PATH: ~/private_keys/AuthKey.p8
        ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY }}
        PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
      run: |
        cd fastlane
        bundle exec fastlane beta_manual
