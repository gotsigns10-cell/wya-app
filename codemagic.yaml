workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SOULAPI

    environment:
      xcode: 16.0
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.universoul.wya
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci && npm run build && npx cap sync ios

      - name: Set up signing
        script: xcode-project use-profiles

      - name: Build Archive
        script: |
          cd ios/App
          BUILD_NUM=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Building with CURRENT_PROJECT_VERSION=$BUILD_NUM"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD_NUM

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
