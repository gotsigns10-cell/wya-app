workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Use same App Store Connect integration as Soul iOS
    integrations:
      app_store_connect: SOULAPI

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.universoul.wya
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"
      groups:
        - appstore

      xcode: 26.6  # Capacitor 8 SPM binaries require Xcode 26+
      node: 22

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS
        script: |
          # Project uses Swift Package Manager (SPM), not CocoaPods
          npx cap sync ios

      - name: Set up signing
        script: |
          # Use Codemagic managed profiles (automatic signing)
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Setting build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD

      - name: Build Archive
        script: |
          set -e
          cd ios/App

          echo "=== Build Environment ==="
          echo "Xcode version:"
          xcodebuild -version
          echo ""

          # Resolve SPM dependencies first
          echo "=== Resolving Swift Package Dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages"

          echo "=== Starting xcodebuild archive ==="
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcodebuild-archive.log

          echo "Archive complete. Checking result..."
          ls -la "$CM_BUILD_DIR/"

          if [ ! -d "$CM_BUILD_DIR/WYA.xcarchive" ]; then
            echo "ERROR: Archive not found!"
            tail -100 /tmp/xcodebuild-archive.log
            exit 1
          fi

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - "$CM_BUILD_DIR/*.xcarchive"
      - /tmp/xcodebuild-*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
