workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SOULAPI

    environment:
      xcode: 27.0
      node: 22
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci && npm run build && npx cap sync ios

      - name: Fetch signing files
        script: |
          # Initialize keychain
          keychain initialize

          # Fetch or create signing files from App Store Connect
          # --create flag generates new cert+profile if none exist
          # Codemagic generates and manages the certificate private key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Add certificates to keychain
          keychain add-certificates

          # Apply profiles to Xcode project
          xcode-project use-profiles

          # Debug: show available identities
          echo "=== Signing Identities ==="
          security find-identity -v -p codesigning | head -10

      - name: Build Archive
        script: |
          cd ios/App
          BUILD_NUM=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 20) + 1))
          echo "Building with CURRENT_PROJECT_VERSION=$BUILD_NUM"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD_NUM

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
