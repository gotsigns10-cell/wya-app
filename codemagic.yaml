workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store_connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.universoul.wya

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.universoul.wya"
        # Private key added directly since UI paste had issues
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgr8Ier4/TD6/oyPXE
          fumV4tzFCYLoX5uuo4Yf4a0HX9egCgYIKoZIzj0DAQehRANCAASt9jLutcwMCKfU
          e6l59TvOamTeWGzPvGNca9JD+yamgv62eAn8s52frJQ3j/bpoE1ieQk2w/G5Uoi5
          BF4SYVO1
          -----END PRIVATE KEY-----

      xcode: 15.4
      node: 20

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          agvtool new-version -all $((LATEST_BUILD + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/Reports/*.xml

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
