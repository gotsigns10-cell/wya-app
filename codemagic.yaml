workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.universoul.wya"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6T7FMU83Q3"
        APP_STORE_CONNECT_ISSUER_ID: "54717bff-71a1-46bc-a578-a94db1886499"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgr8Ier4/TD6/oyPXE
          fumV4tzFCYLoX5uuo4Yf4a0HX9egCgYIKoZIzj0DAQehRANCAASt9jLutcwMCKfU
          e6l59TvOamTeWGzPvGNca9JD+yamgv62eAn8s52frJQ3j/bpoE1ieQk2w/G5Uoi5
          BF4SYVO1
          -----END PRIVATE KEY-----
        CERTIFICATE_PASSWORD: "wya2026"
        # Profile UUID from our created profile
        PROVISIONING_PROFILE_UUID: "866843c3-81a5-4817-b415-d5fb313c6106"

      xcode: 16.0
      node: 20

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS
        script: |
          gem install cocoapods || true
          npx cap sync ios
          echo "Capacitor sync complete"

      - name: Install code signing
        script: |
          # Initialize keychain
          keychain initialize

          # Decode and install certificate
          echo "Installing distribution certificate..."
          base64 -d ios/signing/dist-cert.p12.b64 > /tmp/dist-cert.p12
          keychain add-certificates --certificate /tmp/dist-cert.p12 --certificate-password "$CERTIFICATE_PASSWORD"

          # Decode and install provisioning profile
          echo "Installing provisioning profile..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          base64 -d ios/signing/WYA_App_Store.mobileprovision.b64 > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROVISIONING_PROFILE_UUID.mobileprovision"

          # Verify
          echo "Installed profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          agvtool new-version -all $((LATEST_BUILD + 1))

      - name: Build IPA
        script: |
          # Use xcode-project CLI which handles signing automatically
          xcode-project use-profiles --project "$XCODE_PROJECT"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=9V74TT48MV"

          echo "Build complete"
          find . -name "*.ipa" 2>/dev/null || echo "No IPA found in current dir"
          find "$CM_BUILD_DIR" -name "*.ipa" 2>/dev/null || echo "No IPA found in CM_BUILD_DIR"

    artifacts:
      - build/ipa/*.ipa
      - build/App.xcarchive/
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
