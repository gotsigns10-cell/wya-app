workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SOULAPI

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"
        PROFILE_UUID: "866843c3-81a5-4817-b415-d5fb313c6106"
      xcode: 16.0
      node: 22

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci && npm run build && npx cap sync ios

      - name: Setup signing
        script: |
          keychain initialize

          # Fetch cert and profile from Apple using SOULAPI integration
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true

          # Fallback: install bundled profile
          base64 -D -i ios/signing/WYA_App_Store.mobileprovision.b64 -o /tmp/WYA.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/WYA.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          keychain add-certificates || true
          xcode-project use-profiles || true

          echo "=== Identities ===" && security find-identity -v -p codesigning | head -5

      - name: Build
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))

          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$CM_BUILD_DIR/spm"

          xcodebuild archive \
            -project App.xcodeproj -scheme App \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/spm" \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export
        script: xcode-project build-ipa --archive "$CM_BUILD_DIR/WYA.xcarchive" --ipa build/ios/ipa/WYA.ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
