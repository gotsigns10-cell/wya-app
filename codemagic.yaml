workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SOULAPI

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"
      xcode: 16.0
      node: 22

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install bundled provisioning profile
        script: |
          set -e
          echo "Installing bundled provisioning profile..."

          base64 -D -i ios/signing/WYA_App_Store.mobileprovision.b64 -o /tmp/WYA.mobileprovision

          # Extract UUID using security cms (macOS native)
          PROFILE_UUID=$(security cms -D -i /tmp/WYA.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "866843c3-81a5-4817-b415-d5fb313c6106")
          echo "Profile UUID: $PROFILE_UUID"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/WYA.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Profile installed at: ~/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Set up signing from API
        script: |
          set -e
          echo "=== Setting up code signing ==="

          # Initialize keychain
          keychain initialize

          # Fetch distribution cert from API
          echo "Fetching distribution certificates..."
          app-store-connect certificates list --type IOS_DISTRIBUTION --save || {
            echo "No existing certs, trying DISTRIBUTION type..."
            app-store-connect certificates list --type DISTRIBUTION --save || {
              echo "Creating new distribution certificate..."
              app-store-connect certificates create --type IOS_DISTRIBUTION --save || true
            }
          }

          # Add certs to keychain
          echo "Adding certificates to keychain..."
          keychain add-certificates || echo "Warning: keychain add-certificates had issues"

          # List available identities
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning || echo "No identities found"

          # List installed profiles
          echo "=== Installed provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles dir"

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Setting build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD

      - name: Build Archive
        script: |
          set -e
          cd ios/App

          echo "=== Build Environment ==="
          xcodebuild -version

          # Get profile UUID
          PROFILE_UUID=$(security cms -D -i /tmp/WYA.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "866843c3-81a5-4817-b415-d5fb313c6106")
          echo "Using profile UUID: $PROFILE_UUID"

          # Resolve SPM dependencies
          echo "=== Resolving Swift Package Dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages"

          echo "=== Starting xcodebuild archive ==="
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            "PROVISIONING_PROFILE=$PROFILE_UUID" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        script: |
          set -e

          PROFILE_UUID=$(security cms -D -i /tmp/WYA.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "866843c3-81a5-4817-b415-d5fb313c6106")

          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - "$CM_BUILD_DIR/*.xcarchive"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
