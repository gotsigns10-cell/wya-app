workflows:
  ios-release:
    name: WYA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SOULAPI

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.universoul.wya"
        TEAM_ID: "9V74TT48MV"
        APP_STORE_APPLE_ID: "6829488221"
      xcode: 16.0
      node: 22

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Fetch signing files from App Store Connect
        script: |
          # Fetch or create signing files using App Store Connect API
          # --create will auto-create missing profiles/certs
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up keychain and profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Setting build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD

      - name: Build Archive
        script: |
          set -e
          cd ios/App

          echo "=== Build Environment ==="
          xcodebuild -version

          # Resolve SPM dependencies
          echo "=== Resolving Swift Package Dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages"

          echo "=== Starting xcodebuild archive ==="
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath "$CM_BUILD_DIR/WYA.xcarchive" \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --archive "$CM_BUILD_DIR/WYA.xcarchive" \
            --ipa build/ios/ipa/WYA.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - "$CM_BUILD_DIR/*.xcarchive"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - sergio@instantsignco.com
        notify:
          success: true
          failure: true
